name: spendora
description: A personal finance companion for everyday money habits.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.28.1
  drift_flutter: ^0.2.7
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  currency_picker: ^2.0.21
  dio: ^5.9.2
  flutter_dotenv: ^6.0.0
  damn_nullable: ^0.0.2

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.28.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/spendora_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env